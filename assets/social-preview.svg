<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="spiral-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>
  
  <!-- Decorative spiral in background (large, faded) -->
  <g transform="translate(900, 320)" opacity="0.15">
    <path d="M0 0 
             C 20 -30, 60 -50, 80 -20
             C 100 10, 90 60, 50 80
             C 10 100, -50 90, -80 50
             C -110 10, -100 -60, -50 -100
             C 0 -140, 80 -140, 130 -90
             C 180 -40, 180 50, 130 110
             C 80 170, -30 180, -100 130
             C -170 80, -180 -30, -130 -110
             C -80 -190, 50 -210, 150 -150
             C 250 -90, 260 60, 190 160
             C 120 260, -60 280, -170 200" 
          stroke="url(#spiral-gradient)" 
          stroke-width="40" 
          stroke-linecap="round" 
          fill="none"/>
  </g>
  
  <!-- Main spiral icon -->
  <g transform="translate(480, 260)" filter="url(#glow)">
    <path d="M0 0 
             C 10 -15, 30 -25, 45 -10
             C 60 5, 55 35, 30 50
             C 5 65, -35 55, -55 25
             C -75 -5, -65 -50, -30 -75
             C 5 -100, 60 -90, 90 -55
             C 120 -20, 110 45, 70 85
             C 30 125, -50 115, -95 70
             C -140 25, -130 -60, -80 -110
             C -30 -160, 70 -150, 125 -95
             C 180 -40, 170 65, 110 130" 
          stroke="url(#spiral-gradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          fill="none"/>
  </g>
  
  <!-- Uzumaki Text -->
  <text x="640" y="480" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="96" 
        font-weight="700" 
        fill="url(#text-gradient)"
        filter="url(#glow)">
    Uzumaki
  </text>
  
  <!-- Tagline -->
  <text x="640" y="540" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="400" 
        fill="#8888aa">
    Interactive Spiral Visualization
  </text>
</svg>

